# CactusUpgrade Configuration

# Max cactus columns to grow per scheduler tick across ALL islands.
# Lower = less TPS impact but slower growth on heavy servers.
# Recommended: 30-100 depending on how many islands you have.
max-growths-per-tick: 50

# Base grow time in ticks (20 ticks = 1 second)
# Vanilla cactus grows approximately every 18 minutes = 21600 ticks
# This is randomized by Minecraft, so this is the average base
base-grow-time: 21600

# Upgrade levels configuration
# multiplier: divides the base-grow-time (higher = faster growth)
# Example: base 21600 ticks / 1.5 multiplier = 14400 ticks between growths
upgrade:
  max-level: 10
  levels:
    1:
      multiplier: 1.1
      name: "Cactus Growth I"
    2:
      multiplier: 1.2
      name: "Cactus Growth II"
    3:
      multiplier: 1.3
      name: "Cactus Growth III"
    4:
      multiplier: 1.4
      name: "Cactus Growth IV"
    5:
      multiplier: 1.5
      name: "Cactus Growth V"
    6:
      multiplier: 1.6
      name: "Cactus Growth VI"
    7:
      multiplier: 1.7
      name: "Cactus Growth VII"
    8:
      multiplier: 1.8
      name: "Cactus Growth VIII"
    9:
      multiplier: 1.9
      name: "Cactus Growth IX"
    10:
      multiplier: 2.0
      name: "Cactus Growth X"

# Messages
messages:
  upgrade-reset: "&aCactus upgrade has been reset for island of &e{player}&a."
  upgrade-set: "&aCactus upgrade level set to &e{level} &afor island of &e{player}&a."
  upgrade-info: "&eIsland of &b{player} &ehas cactus upgrade level &b{level} &e(x{multiplier})."
  no-island: "&cThat player doesn't have an island."
  invalid-level: "&cInvalid level. Must be between 0 and {max}."
  no-permission: "&cYou don't have permission to use this command."
  usage: "&cUsage: /cactusupgrade <set|reset|info> <island-owner> [level]"
